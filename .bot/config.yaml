# Engineer-bot task config for databricks-sql-go (the Databricks SQL driver for
# Go). Loaded by databricks_bot_engine.engineer_bot.bot_config.load_bot. The
# reviewer needs NO .bot/config.yaml (its prompts are engine-owned + the optional
# additive .bot/prompts/review/system.md); only the engineer-bot is config-driven.
name: databricks_sql_go_bugfix
marker_namespace: engineer-bot-go
bot_login_prefix: peco-engineer-bot
max_replies_per_thread: 5

# branch_prefix / pr_title_template / commit_message_template are OMITTED: they
# are flow-aware templates, and the engine's per-flow defaults already match what
# we'd hardcode (bug-fix ⇒ branch `ai/bugfix-issue-`, title/commit `fix: …`).

# safe_path denylist (repo-relative). `.git/` and `.gitleaksignore` are ALWAYS
# denied by the engine regardless of this key. We ADD:
#   - .github/ — the workflows that run WITH the bot's tokens; a bug fix has no
#     business editing them, and hard-blocking them at the tool layer removes a
#     self-modification foothold.
#   - build/ — the kernel-lib build scripts + gitignored native artifacts (the
#     SEA/kernel backend is built from the PRIVATE databricks-sql-kernel repo, not
#     here). A pure-Go driver bug fix belongs in the .go source, not this boundary.
#   - testdata/ — read-only golden/fixture data loaded by tests; a fix should not
#     rewrite fixtures to make a test pass.
# Everything else under the repo root stays writable; the human PR-review gate is
# the real safeguard. Reviewers MUST scrutinize any agent diff reaching go.mod /
# go.sum / .golangci.yml / Makefile / .github/, and note that
# internal/client/client.go contains a `stringer`-GENERATED block (a fix should
# not hand-edit the generated section).
denied_subpaths:
  - .github
  - build
  - testdata

# Filled from the tracking ISSUE the maintainer labelled. (pr_body_template has no
# engine default, so it stays required here.)
pr_body_template: |-
  ## Summary

  Automated fix for [#{issue_number}]({issue_url}) — {issue_title}.

  {summary}

  ## Root cause & plan
  {plan}

  ## Files changed
  {files_changed}

  ## Test plan
  {test_plan}

  🤖 Generated by engineer-bot (bug-fix flow) — review before merge.

# Bash tool: argv-PREFIX allowlist (each entry is an exact prefix; args after it
# are model-supplied but constrained). Matching is `argv[:len(prefix)] == prefix`
# with shell=False (no shell metachar expansion). The allowlist IS the bash
# sandbox. The workflow runs `go build ./...` ONCE before the agent (warms the
# module cache); these let the agent build/test after its edits:
#   - `go build ./...` — recompile after a source edit (pure-Go).
#   - `go test` — the agent's verification. Use `go test -run <RegExp> ./...` (or a
#     package path) to run its single e2e repro from driver_e2e_test.go, and unit
#     tests. Default build (no -tags) — the kernel backend is NOT compiled here.
#   - `make test` — the full pure-Go unit suite (CGO_ENABLED=0, via gotestsum).
#   - `make lint` — golangci-lint (the required Lint gate; catches depguard import
#     violations before the PR).
#   - `gofmt -l -s .` — READ-ONLY format check (lists misformatted files). NOTE:
#     `make fmt` / `gofmt -w` are deliberately ABSENT — they rewrite files in
#     place; the agent formats via edit_file, then checks with `gofmt -l`.
#   - `git status` — list changed files (generates no diff, takes no --output).
# `cat`, `ls`, `find`, `go get`, `go mod tidy`, `make fmt`, and diff/log-GENERATING
# git subcommands are deliberately ABSENT — they read/write arbitrary paths or
# dirty go.sum (the bash tool validates only the argv PREFIX). The agent has
# read_file / glob / grep for repo-relative, safe_path-contained reads.
bash_timeout: 900
bash_allowlist:
  - [go, build]
  - [go, test]
  - [make, test]
  - [make, lint]
  - [gofmt, -l, -s, .]
  - [git, status]

# Author phase. The user prompt is ENGINE-RENDERED from the convention template
# .bot/prompts/engineer/user.md: {{token}} placeholders filled from env_tokens
# (the tracking issue's number/title/url, set by the workflow) and context_files
# (the issue body the workflow writes to a file).
author:
  env_tokens:
    issue_number: ISSUE_NUMBER
    issue_title: ISSUE_TITLE
    issue_url: ISSUE_URL
  context_files:
    - issue_body.txt   # {{issue_body}}
  # Close the loop: the author phase reads this log back so fixes benefit from
  # what the retrospective has learned. MUST match `retrospective.log_path` below
  # — the retrospective WRITES that path; the author only READS it if the two
  # agree. (Set together, they connect learning → application.)
  knowledge_log: .claude/knowledge/learning-log.md

# Engine orchestration for the author phase. `bug-fix` runs the plan →
# author_tests → fix pipeline (write a failing test → fix the code → re-run to
# green) and forces the {outcome, reason, red_green_tests, out_of_scope}
# structured output that publish renders into the PR Test plan. The Go testing
# specifics (commands, layout, live e2e requirement) live in
# prompts/engineer/system.md, not here.
flow: bug-fix

# Daily learning extraction (retrospective flow). Run by engineer-bot-learning.yml
# via `python -m databricks_bot_engine.engineer_bot.retrospective`: over an adaptive
# look-back window it sweeps every merged PR (diff + review comments, which the
# engine gathers ITSELF per PR) plus engineer-bot author runs, and if the model
# finds a durable, reusable learning, opens/updates a single rolling PR appending a
# dated section to log_path. Human-gated — never commits the canonical log directly.
# Omitting this block makes the retrospective a no-op.
#
# `system_prompt` is intentionally OMITTED: this repo ships no
# prompts/retrospective_system.md, so the engine's built-in base prompt is used.
# (A set-but-missing system_prompt file would be a hard error; an UNSET key uses
# the base. Add the key later only if you write a repo-specific additive prompt.)
# The learning log is created on first write — no seed file needed.
retrospective:
  log_path: .claude/knowledge/learning-log.md   # MUST match author.knowledge_log above
  branch_prefix: ai/learning-pr-
  pr_label: engineer-bot-learning
