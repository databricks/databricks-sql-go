name: Engineer Bot — Mention

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request
      && github.event.issue.state == 'open'
      && (startsWith(github.event.comment.body, '@bot ')
        || startsWith(github.event.comment.body, fromJson('"@bot\n"'))
        || startsWith(github.event.comment.body, fromJson('"@bot\r"'))
        || github.event.comment.body == '@bot')
      && github.event.comment.user.type == 'User'
      && !contains(github.event.comment.body, '<!-- engineer-bot-go:')
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association)
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.pr.outputs.eligible }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
    steps:
      # Check permissions before requesting the environment's App/model secrets.
      - name: Verify commenter has write access
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          permission=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq '.permission')
          case "$permission" in
            write|maintain|admin) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping @bot request: commenter must have write access or higher."
              ;;
          esac

      - name: Resolve PR branch
        id: pr
        if: steps.permission.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          if ! jq -e --arg repo "$REPO" '.state == "open" and .head.repo.full_name == $repo' <<< "$pr" >/dev/null; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only open PRs with a branch in this repository are supported."
            exit 0
          fi
          {
            echo "eligible=true"
            echo "head_ref=$(jq -r '.head.ref' <<< "$pr")"
          } >> "$GITHUB_OUTPUT"

  mention:
    needs: authorize
    if: needs.authorize.outputs.eligible == 'true'
    environment: azure-prod
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: engineer-bot-comment-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
      # Keep up to 100 pending requests in the shared queue.
      queue: max
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly
    steps:
      # Load actions, config, and prompts from the default branch.
      - name: Checkout bot setup
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup JFrog
        uses: ./.github/actions/setup-jfrog

      - name: Set up Go Toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.25.x'
          cache: false

      - name: Build and warm Go caches
        # Only the trusted checkout is present while registry credentials are available.
        run: |
          go build ./...
          make tools
          go test -run '^$' ./... >/dev/null

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'

      - name: Bot prelude
        id: prelude
        uses: ./.github/actions/bot-prelude
        with:
          app-id: ${{ secrets.ENGINEER_BOT_APP_ID }}
          private-key: ${{ secrets.ENGINEER_BOT_APP_PRIVATE_KEY }}

      - name: Scrub JFrog credentials before the agent runs
        run: |
          rm -f ~/.netrc
          {
            echo "JFROG_ACCESS_TOKEN="
            echo "GOPROXY=off"
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN="
            echo "ACTIONS_ID_TOKEN_REQUEST_URL="
          } >> "$GITHUB_ENV"

      - name: Recheck PR eligibility
        id: pr
        env:
          GH_TOKEN: ${{ steps.prelude.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_REF: ${{ needs.authorize.outputs.head_ref }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          if ! jq -e --arg repo "$REPO" --arg ref "$HEAD_REF" \
            '.state == "open" and .head.repo.full_name == $repo and .head.ref == $ref' <<< "$pr" >/dev/null; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping @bot request: PR is closed or its source branch changed."
            exit 0
          fi
          {
            echo "eligible=true"
            echo "base_sha=$(jq -r '.base.sha' <<< "$pr")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.authorize.outputs.head_ref }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Copy trusted verification tools
        if: steps.pr.outputs.eligible == 'true'
        run: |
          if [ -L pr/bin ]; then
            echo "::error::PR bin path must not be a symlink."
            exit 1
          fi
          mkdir -p pr/bin
          cp --remove-destination bin/gotestsum bin/golangci-lint pr/bin/

      - name: Prepare PR diff reference
        if: steps.pr.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git -C pr rev-parse HEAD)
          export HEAD_SHA
          git -C pr fetch --no-tags origin "$BASE_SHA"
          git -C pr diff --no-ext-diff --no-textconv --no-color "$BASE_SHA...HEAD" -- > "$RUNNER_TEMP/mention-pr.diff"
          python - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          temp = Path(os.environ["RUNNER_TEMP"])
          diff = (temp / "mention-pr.diff").read_text(errors="replace")
          limit = 100_000
          reference = f"Checked-out PR head: {os.environ['HEAD_SHA']}\n\n" + diff[:limit]
          if len(diff) > limit:
              reference += "\n\n[Diff truncated; inspect source files and report any review limitations.]\n"
          path = workspace / "pr/.engineer-mention-pr.diff"
          with path.open("x") as output:
              output.write(reference)
          path.chmod(0o444)
          PY
          printf '\n/.engineer-mention-pr.diff\n' >> pr/.git/info/exclude

      - name: Run engineer mention
        if: steps.pr.outputs.eligible == 'true'
        working-directory: pr
        env:
          GH_TOKEN: ${{ steps.prelude.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          ENGINEER_BOT_MODEL_OVERRIDE: databricks-claude-opus-5-5
          MODEL_ENDPOINT: https://${{ secrets.DATABRICKS_HOST }}/serving-endpoints/databricks-claude-opus-5-5/invocations
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}/pr
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python -m databricks_bot_engine.engineer_bot.run --phase mention \
            --bot "$GITHUB_WORKSPACE/.bot" \
            --system-prompt "$GITHUB_WORKSPACE/.bot/prompts/engineer-mention/system.md"
