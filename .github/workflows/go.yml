name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    name: Lint
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup JFrog
        uses: ./.github/actions/setup-jfrog

      - name: Set up Go Toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Pinned to the exact go.mod directive (1.25.12). The protected
          # runners use GOTOOLCHAIN=local and their toolchain cache lags the
          # latest patch, so a floating '1.25.x' resolves to an older cached
          # patch (<1.25.12) and fails to satisfy the directive. Bump this in
          # lockstep whenever the go.mod directive's patch is raised.
          go-version: '1.25.12'
          cache: false

      - name: Lint
        uses: golangci/golangci-lint-action@db582008a42febd596419635a5abc9d9815daa9c # v9.2.1
        with:
          # v2.x is built with go 1.25+, which is required so the
          # linter can read Go 1.25 stdlib export data. The v1 family
          # was built with go ≤1.23 and produces "could not import
          # sync/atomic" typecheck errors against our `go 1.25.0`
          # directive.
          version: 'v2.12'
  build-and-test:
    name: Test and Build
    strategy:
      # Matches Go's release support window. Per go.dev/doc/devel/release,
      # only the latest two major releases receive security patches.
      # As of 2026-05 that's 1.25 (Active LTS) and 1.26. The protected
      # runners pin GOTOOLCHAIN=local so we can't include 1.24 — Go would
      # refuse to satisfy the `go 1.25.0` directive without auto-downloading.
      # 1.25 is pinned to the exact go.mod directive patch (1.25.12) because
      # protected runners are GOTOOLCHAIN=local and their cache lags the
      # latest patch; a floating '1.25.x' resolves below the directive and
      # fails. 1.26.x stays floating (any 1.26 patch is >= the 1.25.12 floor).
      matrix:
        go-version: ['1.25.12', '1.26.x']
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup JFrog
        uses: ./.github/actions/setup-jfrog

      - name: Set up Go Toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Cache Go artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Get dependencies
        run: |
          if ! command -v make &> /dev/null ; then
            echo "Installing make"
            apt-get update
            apt-get install -y make
          fi
          if ! command -v git &> /dev/null ; then
            echo "Installing git"
            apt-get update
            apt-get install -y git
          fi
          go get -v -t -d ./...

      - name: Test
        run: make test
        env:
          CGO_ENABLED: 0

      - name: Test-Race
        run: make test-race

      - name: Build
        run: make linux
